<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dananjaya Tahmi Ilmi - CV</title>
    <meta name="description" content="Choose English or Indonesian to view Dananjaya Tahmi Ilmi's CV.">
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #000;
            background: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            place-items: center;
        }

        main {
            width: min(100%, 620px);
            padding: clamp(1.5rem, 6vw, 4rem);
            border: 1px solid #000;
        }

        .eyebrow {
            margin: 0 0 1rem;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            line-height: 0.98;
            letter-spacing: -0.06em;
            text-transform: uppercase;
        }

        .intro {
            margin: 1.25rem 0 2rem;
            color: #555;
            line-height: 1.7;
        }

        .language-options {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.75rem;
        }

        .language-options a {
            display: flex;
            min-height: 56px;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            border: 1px solid #000;
            color: #000;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
            transition: background-color 160ms ease, color 160ms ease;
        }

        .language-options a:hover,
        .language-options a:focus-visible {
            background: #000;
            color: #fff;
        }

        @media (max-width: 420px) {
            .language-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Curriculum Vitae</p>
        <h1>Dananjaya Tahmi Ilmi</h1>
        <p class="intro">Select a language to view my CV.</p>
        <nav class="language-options" aria-label="Select language">
            <a href="english.html" lang="en">English</a>
            <a href="indonesia.html" lang="id">Bahasa Indonesia</a>
        </nav>
    </main>
</body>
</html>
